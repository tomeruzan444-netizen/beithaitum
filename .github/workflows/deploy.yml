name: Build & Deploy to Hostinger

# כל push לענף main -> בניית Astro -> העלאה להוסטינגר ב-SSH/rsync.
# חשוב: אינטגרציית ה-Git הנייטיבית של הוסטינגר (hPanel -> Advanced -> Git) חייבת להישאר מנותקת,
# אחרת היא עושה checkout גולמי של הריפו (בלי build) ל-public_html ומפילה את האתר.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'TASK-LOG.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Hostinger via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.SSH_REMOTE_DIR }}
          ARGS: "-avzr --delete"
          EXCLUDE: ".git*"
