name: Build & Deploy to Hostinger

# כל push לענף main -> בניית Astro -> האתר הבנוי נדחף לענף live.
# הוסטינגר מושך את ענף live אוטומטית (Git auto-deploy). אין צורך ב-SSH secrets.
# חשוב: הוסטינגר מחובר רק לענף live (קבצים בנויים). לעולם לא לענף main (קוד מקור, בלי build).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'TASK-LOG.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish built site to branch "live"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: live
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "Build from ${{ github.sha }}"

      # IndexNow: מודיע ל-Bing (ומשם גם לחיפוש של ChatGPT), Yandex ו-Seznam על כל הכתובות.
      # ממתינים שהוסטינגר ימשוך את ענף live לפני השליחה.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          sleep 120
          KEY=275d740af606b629835571efafeabaa2
          URLS=$(grep -o '<loc>[^<]*' dist/sitemap-0.xml | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"itumhouse.co.il\",\"key\":\"$KEY\",\"keyLocation\":\"https://itumhouse.co.il/$KEY.txt\",\"urlList\":$URLS}"
